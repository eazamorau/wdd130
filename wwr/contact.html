<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/rafting.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Zaga White Water Rafting to ask questions about reservations, rafting trips, and our services.">
    <meta name="author" content="Edgar Zamora">
    <title>Contact Us | Zaga White Water Rafting</title>
</head>

<body>
    <header>
        <img src="images/rafting-logo.jpg" alt="Rafting Travel Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>

        <section class="contact-info">
            <div class="company-details">
                <h2>Get in Touch</h2>
                <p>📍 9420 S Riverside Dr, Sandy, Utah 84070</p>
                <p>📞 +1 801-555-0123</p>
                <p>✉️ info@zagarafting.com</p>
            </div>

            <div class="company-map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3030.2633113327333!2d-111.91865332450854!3d40.579942945690426!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x87528884b58b7321%3A0x6ece74d50c71d9f9!2s9420%20S%20Riverside%20Dr%2C%20Sandy%2C%20UT%2084070%2C%20EE.%20UU.!5e0!3m2!1ses-419!2smx!4v1785619164141!5m2!1ses-419!2smx"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>
        </section>
        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/maria-lopez-gm.jpg" alt="Maria Lopez, general manager">
                    <figcaption>Maria Lopez — General Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/david-martinez-hg.jpg"
                      alt="David Martinez, head rafting guide">
                    <figcaption>David Martínez — Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/jessica-williams-csc.jpg"
                      alt="Jessica Williams, customer service coordinator">
                    <figcaption>Jessica Williams — Customer Service Coordinator</figcaption>
                </figure>
            </div>
        </section>
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <div class="form-item">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item">
                    <label for="useremail">Email Address</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
                <fieldset>
                    <legend>Purpose of the Message</legend>

                    <div class="radio-option">
                        <input type="radio" id="general" name="purpose" value="general" required>
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="website" name="purpose" value="website">
                        <label for="website">Website Suggestion</label>
                    </div>
                </fieldset>
                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer class="final">
        <p>©️2026 | Rafting Travel | Edgar Zamora</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-square.svg"
                  alt="Facebook logo"></a>
            <a href="https://instagram.com"><img src="images/instagram-square.svg"
                  alt="Instagram logo"></a>
            <a href="https://youtube.com"><img src="images/youtube-square.svg"
                  alt="Youtube logo"></a>
        </nav>
    </footer>

</body>

</html>
