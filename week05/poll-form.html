<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise of Forms</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form action="">
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="useremail">User email</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="edge">Microdoft Edge</option>
                        <option value="chrome">Google Chrome</option>
                        <option value="mozilla">Mozilla Firefox</option>
                        <option value="opera">Opera</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label>Do you have a household pet?<input type="checkbox" id="pet"
                          name="pet"></label>
                </div>
                <div class="form-item">
                    <label for="feedback">List the places you have lived</label>
                    <textarea name="feedback" id="feedback"
                      placeholder="Mexico City, Salt Lake, Oaxaca, Reynosa, Vicky Ranch"
                      rows="4"></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>©️2026 | HTML Form - User Poll Activity | Edgar Zamora</p>
    </footer>
</body>

</html>
